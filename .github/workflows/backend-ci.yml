name: Backend CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Foundry tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge version
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Format check
        run: forge fmt --check
